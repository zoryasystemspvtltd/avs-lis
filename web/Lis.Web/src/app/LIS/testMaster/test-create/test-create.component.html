<div class="container-fluid" *ngIf="isLoaded">

    <div class="row">

        <div class="col-md-10 col-md-offset-1">

            <div class="page-card">

                <form [formGroup]="createTestForm" (ngSubmit)="onSubmit()">


                    <!-- Header with double line -->
                    <div class="page-header-title">

                        <h2 class="page-title">
                            Add Test
                        </h2>

                        <div class="double-line"></div>

                    </div>


                    <!-- Test Information -->

                    <div class="row form-row">


                        <!-- Test Code -->

                        <div class="col-md-2">
                            <label>
                                Test Code
                                <span class="required">*</span>
                            </label>
                        </div>


                        <div class="col-md-4">

                            <div class="input-group">

                                <span class="input-group-addon">
                                    <i class="glyphicon glyphicon-barcode"></i>
                                </span>


                                <input
                                    type="text"
                                    class="form-control"
                                    formControlName="hisTestCode"
                                    placeholder="Auto-generated"
                                    readonly>

                            </div>


                            <small class="error"
                                *ngIf="isInValid('hisTestCode')">

                                Test Code is required.

                            </small>

                        </div>



                        <!-- Test Name -->

                        <div class="col-md-2">

                            <label>
                                Test Name
                                <span class="required">*</span>
                            </label>

                        </div>



                        <div class="col-md-4">


                            <div class="input-group">


                                <span class="input-group-addon">

                                    <i class="glyphicon glyphicon-tag"></i>

                                </span>



                                <input
                                    type="text"
                                    class="form-control"
                                    formControlName="hisTestCodeDescription"
                                    placeholder="Enter Test Name"
                                    maxlength="100">


                            </div>


                            <small class="error"
                                *ngIf="isInValid('hisTestCodeDescription')">

                                Test Name is required.

                            </small>


                        </div>


                    </div>




                    <!-- Specimen and Department -->


                    <div class="row form-row">


                        <!-- Specimen -->

                        <div class="col-md-2">

                            <label>
                                Specimen
                                <span class="required">*</span>
                            </label>

                        </div>



                        <div class="col-md-4">


                            <div class="input-group">


                                <span class="input-group-addon">

                                    <i class="glyphicon glyphicon-list"></i>

                                </span>



                                <select
                                    class="form-control"
                                    formControlName="hisSpecimenCode">


                                    <option value="">
                                        Select Specimen
                                    </option>


                                    <option
                                        *ngFor="let specimen of specimens"
                                        [ngValue]="specimen.code || specimen.Code">


                                        {{specimen.name || specimen.Name}}


                                    </option>


                                </select>


                            </div>


                            <small class="error"
                                *ngIf="isInValid('hisSpecimenCode')">

                                Specimen is required.

                            </small>


                        </div>




                        <!-- Department -->

                        <div class="col-md-2">

                            <label>
                                Department
                                <span class="required">*</span>
                            </label>

                        </div>



                        <div class="col-md-4">


                            <div class="input-group">


                                <span class="input-group-addon">

                                    <i class="glyphicon glyphicon-list"></i>

                                </span>



                                <select
                                    class="form-control"
                                    formControlName="departmentCode">


                                    <option value="">
                                        Select Department
                                    </option>


                                    <option
                                        *ngFor="let department of departments"
                                        [ngValue]="department.code || department.Code">


                                        {{department.name || department.Name}}


                                    </option>


                                </select>


                            </div>



                            <small class="error"
                                *ngIf="isInValid('departmentCode')">


                                Department is required.


                            </small>



                        </div>



                    </div>





                    <!-- Active -->


                    <div class="row form-row">


                        <div class="col-md-2">

                            <label>
                                Active
                            </label>

                        </div>



                        <div class="col-md-10">


                            <input
                                type="checkbox"
                                formControlName="isActive">


                        </div>


                    </div>




                    <alert></alert>



                    <!-- Bottom line -->


                    <div class="bottom-line"></div>




                    <!-- Buttons -->


                    <div class="button-area">


                        <button
                            class="btn btn-save"
                            [disabled]="loading">


                            <span
                                *ngIf="loading"
                                class="spinner-border spinner-border-sm">
                            </span>


                            Submit


                        </button>




                        <button
                            type="button"
                            class="btn btn-cancel"
                            (click)="router.navigate(['/test-master'])">


                            Cancel


                        </button>



                    </div>



                </form>


            </div>


        </div>

    </div>


</div>
