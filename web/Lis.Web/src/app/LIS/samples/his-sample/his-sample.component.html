<div class="his-sample-dashboard panel panel-default" *ngIf="!hideCreateButton">
  <div class="panel-heading his-sample-heading">
    <h4 class="panel-title">
      <span class="glyphicon glyphicon-blackboard"></span> Recent Samples
    </h4>
    <a routerLink="/samples" class="btn btn-default btn-xs">View all</a>
  </div>
  <div class="panel-body">
    <div *ngIf="loading" class="his-sample-status">
      <span class="glyphicon glyphicon-refresh glyphicon-spin"></span> Loading recent samples...
    </div>

    <div *ngIf="!loading && loadError" class="alert alert-warning his-sample-alert">
      <span class="glyphicon glyphicon-exclamation-sign"></span> {{ loadError }}
      <button type="button" class="btn btn-default btn-xs pull-right" (click)="loadRecentSamples()">Retry</button>
    </div>

    <div *ngIf="!loading && !loadError && !recentSamples.length" class="his-sample-empty">
      <span class="glyphicon glyphicon-inbox"></span>
      <p>No recent samples available.</p>
      <a routerLink="/samples" class="btn btn-default btn-sm">Go to Recent Samples</a>
    </div>

    <div *ngIf="!loading && recentSamples.length" class="table-responsive">
      <table class="table table-striped table-condensed his-sample-table">
        <thead>
          <tr>
            <th>Barcode</th>
            <th>Patient</th>
            <th>Test</th>
            <th>Collection Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sample of recentSamples">
            <td>
              <a [routerLink]="['/samples', sample.id]">{{ sample.sampleNo || '—' }}</a>
            </td>
            <td>{{ patientName(sample) }}</td>
            <td>{{ testName(sample) }}</td>
            <td>{{ sample.sampleCollectionDate | date:'dd/MM/yyyy' }}</td>
            <td>
              <a [routerLink]="['/lab-result-entry', sample.sampleNo]" class="btn btn-primary btn-xs">Results</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
