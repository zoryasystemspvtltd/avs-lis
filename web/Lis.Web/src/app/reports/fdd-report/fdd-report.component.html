<div class="zorya-report-page">
  <div class="zorya-report-header">
    <div class="zorya-report-title">
      <h3><span class="glyphicon glyphicon-stats"></span> {{ pageTitle }}</h3>
    </div>
    <div class="zorya-report-header-actions">
      <button type="button" class="btn btn-success btn-sm" (click)="exportExcel()" [disabled]="!canExport">
        <span class="glyphicon glyphicon-export"></span> {{ exporting ? 'Exporting...' : 'Export to Excel' }}
      </button>
    </div>
  </div>

  <div class="zorya-report-filters">
    <div class="zorya-report-filters-title">Search criteria</div>
    <div class="filter-row">
      <div class="filter-field">
        <label>From Date <span class="req">*</span></label>
        <input type="date" class="form-control input-sm" [(ngModel)]="fromDate" (ngModelChange)="onFromDateChange()" />
      </div>
      <div class="filter-field">
        <label>To Date <span class="req">*</span></label>
        <input type="date" class="form-control input-sm" [(ngModel)]="toDate" [min]="fromDate" [max]="maxToDate" />
      </div>
      <div class="filter-field filter-wide" *ngIf="showPatientFilter">
        <label>Patient</label>
        <ng-select [items]="patients" bindLabel="name" bindValue="id" [(ngModel)]="patientId"
          placeholder="All patients" [clearable]="true" class="zorya-report-select"></ng-select>
      </div>
      <div class="filter-field" *ngIf="showCollectorFilter">
        <label>Collector</label>
        <input class="form-control input-sm" [(ngModel)]="collectorName" />
      </div>
      <div class="filter-field" *ngIf="showModalityFilter">
        <label>Modality</label>
        <input class="form-control input-sm" [(ngModel)]="modality" />
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary btn-sm" (click)="search(1)" [disabled]="loading">Search</button>
        <button type="button" class="btn btn-default btn-sm" (click)="reset()" [disabled]="loading">Reset</button>
      </div>
    </div>
    <p class="filter-error" *ngIf="filterError">{{ filterError }}</p>
  </div>

  <div class="zorya-report-grid-wrap" [class.is-loading]="loading">
    <div class="table-responsive zorya-report-table-scroll" *ngIf="!loading && rows.length">
      <table class="table table-hover zorya-report-table">
        <thead><tr><th *ngFor="let col of columns">{{ col.header }}</th></tr></thead>
        <tbody>
          <tr *ngFor="let row of rows">
            <td *ngFor="let col of columns">
              <ng-container [ngSwitch]="col.type">
                <span *ngSwitchCase="'date'">{{ row[col.field] | date:'dd/MM/yyyy' }}</span>
                <span *ngSwitchCase="'datetime'">{{ row[col.field] | date:'dd/MM/yyyy HH:mm' }}</span>
                <span *ngSwitchDefault>{{ row[col.field] || '—' }}</span>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="zorya-report-empty" *ngIf="!loading && searched && !rows.length">
      <p>No records found.</p>
    </div>
  </div>

  <div class="zorya-report-pager" *ngIf="searched && totalRecord > 0 && !loading">
    <ngb-pagination [(page)]="currentPage" [pageSize]="recordPerPage" [collectionSize]="totalRecord"
      (pageChange)="onPageChange($event)"></ngb-pagination>
  </div>
</div>
